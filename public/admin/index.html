<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 · 붓다담마 법보시 도서관</title>
<link href="/admin/config.yml" type="application/yaml" rel="cms-config-url">
</head>
<body>
<script>
// 관리자 기기는 사이트 통계에서 빼기 (처음 한 번만 — /admin/stats/ 에서 바꿀 수 있음)
try { if (!localStorage.getItem('dd-notrack')) localStorage.setItem('dd-notrack', 'true'); } catch (e) {}
// 다른 관리 화면으로 가는 단추
// 컴퓨터: 오른쪽 아래(통계·종이책 신청·파일 올리기), 왼쪽 아래(학습 자료실·아카이빙 자료실)
// 휴대폰(너비 700px 이하): 단추가 겹치지 않게 왼쪽 아래 '☰ 관리 메뉴' 하나로 모으고, 누르면 목록이 위로 펼쳐짐 (운영자 요청, 2026-11-12)
document.addEventListener('DOMContentLoaded', () => {
  const R = [['/admin/stats/', '📊 통계'], ['/admin/paper/', '📦 종이책 신청'], ['/admin/upload/', '⬆ 파일 올리기']];
  const L = [['/study/', '📚 학습 자료실'], ['/archive/', '🗄 아카이빙 자료실']];
  const st = document.createElement('style');
  st.textContent = `
.dd-nav{position:fixed;bottom:12px;z-index:9999;display:flex;gap:6px;font:13px sans-serif}
.dd-nav a{background:#fff;border:1px solid #ccc;border-radius:999px;padding:5px 10px;color:#5b3a1e;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.15);white-space:nowrap}
.dd-r{right:12px}.dd-l{left:12px}
.dd-m{display:none}
@media (max-width:700px){
 .dd-r,.dd-l{display:none}
 .dd-m{display:block;position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;font:15px sans-serif}
 .dd-m>button{border:1px solid #c9b8a6;background:#fff;color:#5b3a1e;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
 .dd-m>div{display:none;position:absolute;left:0;bottom:calc(100% + 8px);background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:6px;min-width:210px}
 .dd-m.open>div{display:block}
 .dd-m a{display:block;padding:12px 14px;color:#5b3a1e;text-decoration:none;border-radius:10px}
 .dd-m a+a{border-top:1px solid #f0ebe4}
 .dd-m a:active{background:#f6efe6}
}`;
  document.head.appendChild(st);
  const pill = a => a.map(([h, t]) => `<a href="${h}">${t}</a>`).join('');
  const r = document.createElement('div'); r.className = 'dd-nav dd-r'; r.innerHTML = pill(R);
  const l = document.createElement('div'); l.className = 'dd-nav dd-l'; l.innerHTML = pill(L);
  const m = document.createElement('div'); m.className = 'dd-m';
  m.innerHTML = `<div>${pill([...L, ...R])}</div><button type="button" aria-expanded="false">☰ 관리 메뉴</button>`;
  const b = m.querySelector('button');
  b.addEventListener('click', e => { e.stopPropagation(); const o = m.classList.toggle('open'); b.setAttribute('aria-expanded', o); });
  document.addEventListener('click', e => { if (!m.contains(e.target)) { m.classList.remove('open'); b.setAttribute('aria-expanded', false); } });
  document.body.append(r, l, m);
});
</script>
<script>
// 책 본문처럼 아주 긴 글 칸이 버벅이지 않게 (운영자 요청, 2026-11-12)
// 관리 화면(Sveltia)은 글자 하나 칠 때마다 책 본문 전체를 다시 계산해서 느려짐 →
// 긴 칸(2만 자 넘음)은 그 자리에 가벼운 '빠른 입력 칸'을 겹쳐 두고, 거기서 치는 글은
// 손을 1초 멈추거나 · 칸 밖을 누르거나 · 저장 단추를 누르기 직전에 한꺼번에 관리 화면으로 넘김.
// 맞춤법 검사(빨간 밑줄)도 끔.
(() => {
  const BIG = 20000, WAIT = 1000, pairs = new Map();  // 원래 칸 → { fast, last, timer, dirty }
  const push = (orig, o) => {  // 빠른 칸의 글을 관리 화면으로
    clearTimeout(o.timer); o.timer = 0;
    if (!o.dirty) return; o.dirty = false;
    if (orig.value === o.fast.value) return;
    const set = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
    set.call(orig, o.fast.value); o.last = o.fast.value;
    orig.dispatchEvent(new Event('input', { bubbles: true })); orig.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const flushAll = () => pairs.forEach((o, orig) => push(orig, o));
  const make = orig => {
    const fast = document.createElement('textarea');
    fast.className = 'dd-fast'; fast.value = orig.value; fast.spellcheck = false;
    ['spellcheck', 'autocorrect', 'autocapitalize', 'autocomplete'].forEach(k => fast.setAttribute(k, k === 'spellcheck' ? 'false' : 'off'));
    fast.style.cssText = 'display:block;width:100%;height:70vh;box-sizing:border-box;font:15px/1.7 ui-monospace,monospace,sans-serif;padding:10px 12px;border:1px solid #c9b8a6;border-radius:8px;resize:vertical;white-space:pre-wrap;background:#fff;color:#222';
    const o = { fast, last: orig.value, timer: 0, dirty: false };
    fast.addEventListener('input', () => { o.dirty = true; clearTimeout(o.timer); o.timer = setTimeout(() => push(orig, o), WAIT); });
    fast.addEventListener('blur', () => push(orig, o));
    orig.style.display = 'none';
    orig.insertAdjacentElement('afterend', fast);
    pairs.set(orig, o);
  };
  setInterval(() => {
    document.querySelectorAll('textarea:not(.dd-fast)').forEach(t => { if (!pairs.has(t) && t.value.length >= BIG) make(t); });
    pairs.forEach((o, orig) => {
      if (!orig.isConnected) { o.fast.remove(); pairs.delete(orig); return; }
      if (!o.dirty && orig.value !== o.last) { o.fast.value = orig.value; o.last = orig.value; }  // 다른 책을 열었거나 되돌린 경우
    });
  }, 700);
  // 저장·다른 화면 단추를 누르기 직전, Ctrl+S 직전에 먼저 넘김
  document.addEventListener('pointerdown', e => { if (!e.target.closest || !e.target.closest('.dd-fast')) flushAll(); }, true);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') flushAll(); }, true);
  addEventListener('beforeunload', flushAll);
})();
</script>
<script src="https://unpkg.com/@sveltia/cms@0.259.0/dist/sveltia-cms.js"></script>
<script>
// 책 본문 굵은 글씨: 본문 칸에서 글을 고르면 'B 굵게' 단추가 뜹니다 (Ctrl+B / ⌘+B 도 됨). 고른 글을 **글** 로 감싸고, 이미 굵으면 풀어 줍니다.
(() => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = 'B 굵게';
  btn.title = '고른 글을 굵게 (다시 누르면 풀림) · Ctrl+B';
  btn.style.cssText = 'position:fixed;z-index:99999;display:none;padding:6px 12px;border:0;border-radius:8px;background:#5b3a1e;color:#fff;font:bold 14px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  let ta = null, mx = 0, my = 0;
  const inTexts = () => /collections\/texts\//.test(location.hash);
  const sel = () => { const a = document.activeElement; return a && a.tagName === 'TEXTAREA' && inTexts() && a.selectionEnd > a.selectionStart ? a : null; };
  const show = () => { ta = sel(); if (!ta) { btn.style.display = 'none'; return; } btn.style.left = Math.min(mx + 8, innerWidth - 90) + 'px'; btn.style.top = Math.max(my - 44, 8) + 'px'; btn.style.display = 'block'; };
  const toggle = t => {
    let a = t.selectionStart, b = t.selectionEnd, v = t.value, x = v.slice(a, b);
    // 앞뒤 빈칸은 굵게 안에 넣지 않음
    while (a < b && /\s/.test(v[a])) a++; while (b > a && /\s/.test(v[b - 1])) b--; x = v.slice(a, b); if (!x) return;
    t.focus();
    if (/^\*\*[\s\S]*\*\*$/.test(x) && x.length > 4) { t.setSelectionRange(a, b); document.execCommand('insertText', false, x.slice(2, -2)); t.setSelectionRange(a, b - 4); }
    else if (v.slice(a - 2, a) === '**' && v.slice(b, b + 2) === '**') { t.setSelectionRange(a - 2, b + 2); document.execCommand('insertText', false, x); t.setSelectionRange(a - 2, b - 2); }
    else if (/\n\s*\n/.test(x)) { alert('굵게는 한 문단 안에서만 쓸 수 있습니다. 문단마다 따로 골라 주세요.'); return; }
    else { t.setSelectionRange(a, b); document.execCommand('insertText', false, '**' + x.replace(/\*\*/g, '') + '**'); t.setSelectionRange(a + 2, a + 2 + x.replace(/\*\*/g, '').length); }
    t.dispatchEvent(new Event('input', { bubbles: true }));
    btn.style.display = 'none';
  };
  document.addEventListener('mouseup', e => { if (e.target === btn) return; mx = e.clientX; my = e.clientY; setTimeout(show, 0); });
  document.addEventListener('keyup', e => { if (e.shiftKey && !sel()) btn.style.display = 'none'; else if (!sel()) btn.style.display = 'none'; });
  document.addEventListener('selectionchange', () => { if (sel()) { if (!mx) { mx = innerWidth / 2 - 40; my = innerHeight - 60; } show(); } });
  document.addEventListener('touchend', e => { const t = e.changedTouches[0]; if (t) { mx = t.clientX; my = t.clientY; } });
  document.addEventListener('scroll', () => { btn.style.display = 'none'; }, true);
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => { const t = ta; if (t) toggle(t); });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b') { const t = sel(); if (t) { e.preventDefault(); toggle(t); } } });
})();
</script>
</body>
