# 관리자 화면 설정 (Sveltia CMS) — 여기 적힌 칸들이 관리자 화면에 나옵니다.
backend:
  name: github
  repo: dhammapiya3-lab/dhammadana
  branch: main
  commit_messages:
    create: "새로 만듦: {{collection}} {{slug}}"
    update: "고침: {{collection}} {{slug}}"
    delete: "지움: {{collection}} {{slug}}"
    uploadMedia: "그림 올림: {{path}}"
    deleteMedia: "그림 지움: {{path}}"

site_url: https://dhammadana.kr
display_url: https://dhammadana.kr
logo_url: /images/icon.svg
media_folder: public/uploads
public_folder: /uploads
locale: ko
# 새로 만든 파일 이름의 대문자를 그대로 둠 (DL-0008.json 이 dl-0008.json 이 되지 않게)
slug:
  lowercase: false

collections:
  # ───────── 책 ─────────
  - name: books
    editor: { preview: false }
    label: 책
    label_singular: 책
    description: "도서관의 책들입니다. 책 파일(PDF·EPUB)은 https://dhammadana.kr/admin/upload/ 에서 올리면 저절로 연결됩니다."
    folder: content/books
    format: json
    extension: json
    identifier_field: id
    slug: "{{fields.id}}"
    create: true
    summary: "{{id}} · {{title}}"
    sortable_fields: [id, title, added]
    fields:
      - { name: id, label: 자료번호, hint: "DL-0008 처럼 차례대로 붙입니다. 한 번 정하면 바꾸지 마세요.", pattern: ['^DL-\d{4}$', 'DL-0000 꼴로 적어 주세요'] }
      - { name: title, label: 제목 }
      - { name: subtitle, label: 부제, required: false }
      - { name: cover, label: 표지 그림, widget: image, required: false }
      - { name: byline, label: 책에 적힌 저자 표기, hint: "책에 인쇄된 그대로 (예: 난다말라비왐사 큰스님 지음)" }
      - { name: translator, label: 옮긴이·편자, required: false, hint: "책에 인쇄된 그대로 (예: 식카와띠 위뿔라냐니 옮김)" }
      - name: teacher
        label: 스승
        hint: 이 책의 가르침을 펴신 스승. 목록에 없으면 먼저 '목록 → 스승'에 더하세요. 사전처럼 스승이 없는 책은 비워 둡니다.
        widget: relation
        collection: lists
        file: teachers
        value_field: "items.*.id"
        search_fields: ["items.*.name", "items.*.roman"]
        display_fields: ["items.*.name"]
        required: false
      - name: provider
        label: 자료 제공처
        widget: relation
        collection: lists
        file: providers
        value_field: "items.*.id"
        search_fields: ["items.*.name"]
        display_fields: ["items.*.name"]
      - { name: press, label: 我無말들 출판물, widget: boolean, default: false }
      - { name: paper, label: 종이책 상태, widget: select, required: false, options: [{ label: "종이책 보시 신청", value: request }, { label: "종이책 품절", value: soldout }, { label: "전자책 Only", value: ebook }], hint: "我無말들 출판도서 페이지에 표시됩니다. 비워 두면 표시하지 않습니다." }
      - { name: paper_url, label: 종이책 보시 신청 외부 링크, required: false, hint: "'종이책 보시 신청'일 때, 사이트 신청 게시판 대신 이 주소(예: 카페 글)로 연결합니다. 비워 두면 사이트 신청 게시판으로 갑니다." }
      - name: stores
        label: 인터넷 서점 링크
        label_singular: 서점 링크
        widget: list
        required: false
        summary: "{{fields.name}} {{fields.url}}"
        hint: "책 정보의 '이 책 읽어보기' 칸에 '인터넷 서점 바로가기' 단추로 보입니다. 이름을 적으면 '교보문고 바로가기'처럼, 비워 두면 '인터넷 서점 바로가기'로 보입니다."
        fields:
          - { name: name, label: 서점 이름 (선택), required: false, hint: "예: 교보문고, 알라딘, YES24" }
          - { name: url, label: 링크 주소, hint: "https:// 로 시작하는 책 판매 페이지 주소" }
      - { name: book_type, label: 책 형식, widget: select, required: false, options: [경전, 예불집, 법문집, 해설서, 잠언집, 수행기, 사전], hint: "도서관 '찾아보기'의 책 형식으로 나뉩니다" }
      - { name: original_title, label: 원서 제목, required: false }
      - { name: original_language, label: 원서의 언어, widget: select, required: false, options: [빠알리어, 영어, 미얀마어, 태국어, 싱할라어, 한국어, 기타], hint: "이 책을 옮길 때 바탕으로 삼은 원서의 언어" }
      - { name: original_source, label: 원서 정보, required: false, hint: "원서 출판사·연도 등" }
      - { name: series, label: 총서·시리즈, required: false }
      - name: main
        label: 주요 자료
        widget: relation
        collection: lists
        file: topics
        value_field: "main.*.label"
        search_fields: ["main.*.label"]
        multiple: true
        required: false
      - name: topics
        label: 주제
        hint: 여러 개 고를 수 있습니다. 새 주제는 '목록 → 주제'에서 더합니다.
        widget: relation
        collection: lists
        file: topics
        value_field: "items.*.label"
        search_fields: ["items.*.label", "items.*.group"]
        display_fields: ["items.*.label"]
        multiple: true
        required: false
      - { name: description, label: 책 소개, widget: markdown, required: false }
      - { name: author_intro, label: 저자 소개, widget: markdown, required: false, hint: "책에 실린 저자(스승) 소개. 목차 위에 나옵니다." }
      - { name: translator_intro, label: 옮긴이 소개, widget: markdown, required: false, hint: "옮긴이·편역자 소개. 저자 소개 아래, 목차 위에 나옵니다." }
      - { name: contents, label: 목차, widget: text, required: false, hint: "한 줄에 한 장씩 적습니다. 아랫단계는 줄 앞에 '-' 를 붙입니다. 쪽수는 '제1장 자애란 ... 15' 처럼 끝에 적으면 오른쪽에 나옵니다." }
      - name: editions
        label: 판 (초판·개정판)
        label_singular: 판
        collapsed: true
        hint: "판마다 한 칸입니다. 파일이 없는 지난 판(예를 들어 초판)도 '판 더하기'로 발행일만 적어 기록할 수 있습니다. 지금 내려받기·읽기에 쓰는 판에만 '최신판'을 켜세요. 이전 판은 지우지 말고 보관합니다."
        widget: list
        summary: "{{fields.label}} {{fields.published}}"
        fields:
          - { name: label, label: 판 이름, hint: "초판, 개정1판 …" }
          - { name: label_display, label: 책 정보에 보일 판 이름, required: false, hint: "판 이름과 다르게 보여 주고 싶을 때만. 예: 개정판 (epub는 초판)" }
          - { name: current, label: 최신판, widget: boolean, default: true }
          - { name: public, label: 공개, widget: boolean, default: true }
          - { name: page_count, label: 쪽수, widget: number, value_type: int, required: false, hint: "책의 전체 쪽수 (숫자만)" }
          - { name: published, label: 종이책 발행일, required: false, hint: "예: 2024년 5월 1일" }
          - { name: publisher_print, label: 종이책 출판사, required: false, hint: "종이책을 펴낸 출판사 (없거나 모르면 비워 두세요)" }
          - { name: isbn, label: 종이책 ISBN, required: false, hint: "예: 979-11-12345-67-8 (없으면 비워 두세요)" }
          - { name: published_ebook, label: 전자책 발행일, required: false, hint: "전자책을 종이책과 다른 날 펴냈으면 적어 주세요. 예: 2024년 8월 1일" }
          - { name: publisher_ebook, label: 전자책 출판사, required: false, hint: "전자책(EPUB·PDF)을 펴낸 곳이 종이책과 다르면 적어 주세요" }
          - { name: isbn_ebook, label: 전자책 ISBN, required: false, hint: "전자책 ISBN이 따로 있으면 적어 주세요" }
          - { name: changes, label: 바뀐 내용, required: false }
          - { name: hide_update, label: 첫 화면 '최근 업데이트'에서 이 판 소식 빼기, widget: boolean, default: false, required: false }
          - name: pdf
            label: PDF (화면용)
            widget: object
            fields:
              - { name: mode, label: 방식, widget: select, options: [{ label: "없음", value: none }, { label: "우리 저장소(R2)", value: file }, { label: "다른 사이트로 연결", value: link }], default: none }
              - { name: url, label: 주소, required: false, hint: "R2면 pdf/DL-0007/DL-0007_초판.pdf 처럼, 다른 사이트면 https:// 로 시작하는 주소" }
              - { name: site, label: 연결할 사이트 이름, required: false }
              - { name: created, label: 이 파일 만든 날, required: false, hint: "예: 2024년 5월 1일 (내려받는 파일 이름에 붙습니다)" }
          - name: pdf_print
            label: PDF (인쇄용 / 인쇄용 본문)
            hint: 인쇄용 PDF가 따로 있을 때. 표지가 따로 있으면 여기는 본문을, 아래 '인쇄용 표지'에 표지를 넣습니다.
            widget: object
            fields:
              - { name: mode, label: 방식, widget: select, options: [{ label: "없음", value: none }, { label: "우리 저장소(R2)", value: file }, { label: "다른 사이트로 연결", value: link }], default: none }
              - { name: url, label: 주소, required: false }
              - { name: site, label: 연결할 사이트 이름, required: false }
              - { name: created, label: 이 파일 만든 날, required: false, hint: "예: 2024년 5월 1일 (내려받는 파일 이름에 붙습니다)" }
          - name: pdf_cover
            label: PDF (인쇄용 표지)
            hint: 인쇄용 표지 PDF가 본문과 따로 있을 때
            widget: object
            fields:
              - { name: mode, label: 방식, widget: select, options: [{ label: "없음", value: none }, { label: "우리 저장소(R2)", value: file }, { label: "다른 사이트로 연결", value: link }], default: none }
              - { name: url, label: 주소, required: false }
              - { name: site, label: 연결할 사이트 이름, required: false }
              - { name: created, label: 이 파일 만든 날, required: false, hint: "예: 2024년 5월 1일 (내려받는 파일 이름에 붙습니다)" }
          - name: epub
            label: EPUB
            widget: object
            fields:
              - { name: mode, label: 방식, widget: select, options: [{ label: "없음", value: none }, { label: "우리 저장소(R2)", value: file }, { label: "다른 사이트로 연결", value: link }], default: none }
              - { name: url, label: 주소, required: false }
              - { name: site, label: 연결할 사이트 이름, required: false }
              - { name: created, label: 이 파일 만든 날, required: false, hint: "예: 2024년 5월 1일 (내려받는 파일 이름에 붙습니다)" }
          - { name: reader, label: 온라인 읽기, widget: boolean, default: false, hint: "PDF를 읽기 자료로 바꿔 R2에 올린 뒤에 켜세요" }
          - name: sources
            label: 원본 출처
            widget: list
            collapsed: true
            required: false
            hint: "파일마다 원본을 가져온 곳이 다르면 하나씩 더해서 '어느 파일'을 골라 주세요."
            summary: "{{fields.file}} {{fields.url}}"
            fields:
              - { name: file, label: 어느 파일, widget: select, required: false, options: [{ label: "모든 파일", value: all }, { label: "PDF (화면용)", value: pdf }, { label: "PDF (인쇄용 / 인쇄용 본문)", value: pdf_print }, { label: "PDF (인쇄용 표지)", value: pdf_cover }, { label: "EPUB", value: epub }], hint: "비워 두면 모든 파일" }
              - { name: url, label: 주소 }
              - { name: checked, label: 확인한 날, required: false }
              - { name: archive, label: 보관본 주소, required: false, hint: "web.archive.org 에 저장한 주소" }
          - { name: collection, label: 수집 경로, required: false, hint: "예: 저자에게서 직접 받음" }
          - { name: collected, label: 받은 날, required: false }
          - { name: permission_status, label: 게시 허락 상태, widget: select, required: false, options: [{ label: "허락 확인됨 (저작권자·옮긴이에게 허락받음)", value: confirmed }, { label: "공개 배포됨 (저작권자가 누구나 나눠도 되게 공개함)", value: public }, { label: "대기 중", value: pending }], hint: "비워 두면 아래 허락 기록이 있을 때 '허락 확인됨'으로 나옵니다." }
          - { name: notice, label: 알림, widget: text, required: false, hint: "기타 알릴 것이 있을 때만 적어 주세요. 비워 두면 책 정보에 나오지 않습니다." }
          - { name: permission_note, label: 게시 허락 문구 (책 속 문구), widget: text, required: false, hint: "예: 본 도서는 법보시용 도서(비매품)입니다. … 책에 적힌 그대로 옮겨 적습니다." }
          - { name: permission_image, label: 이 판의 허락서 그림, widget: image, required: false, hint: "허락서를 찍은 사진이나 스캔 파일. 누구나 '허락서 보기'로 볼 수 있습니다." }
          - name: permissions
            label: 게시 허락
            widget: relation
            collection: lists
            file: permissions
            value_field: "items.*.id"
            search_fields: ["items.*.name"]
            display_fields: ["items.*.name"]
            multiple: true
            required: false
          - { name: note, label: 메모 (사이트에 안 나옴), widget: text, required: false }
      - { name: license, label: 라이선스, widget: select, options: ["CC BY-NC-ND", "CC BY-NC-SA", "CC BY-NC", "CC BY", "저작권자 허락", "자유 이용(퍼블릭 도메인)"], default: "CC BY-NC-ND" }
      - { name: added, label: 등록일, widget: datetime, type: date, format: "YYYY-MM-DD" }
      - { name: order, label: 순서, widget: number, value_type: int, required: false, hint: "같은 날 등록한 책끼리의 순서 (클수록 앞)" }
      - { name: hidden, label: 숨기기, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않습니다" }
      - { name: hide_update, label: 첫 화면 '최근 업데이트'에서 등록 소식 빼기, widget: boolean, default: false, required: false, hint: "켜면 첫 화면 '최근 업데이트'에 이 책의 '등록' 항목이 나오지 않습니다. 책은 도서관에 그대로 있습니다." }

  # ───────── 책 본문 (글로 읽기) ─────────
  - name: texts
    editor: { preview: false }
    label: 책 본문 (글로 읽기)
    label_singular: 책 본문
    description: "읽기 화면에 나오는 글입니다. 고치고 저장하면 1~2분 뒤 읽기 화면에 반영됩니다. 고치기 전 내용은 기록으로 남아 언제든 되돌릴 수 있습니다."
    folder: content/texts
    format: json
    extension: json
    identifier_field: book
    slug: "{{fields.book}}"
    create: true
    summary: "{{book}} · {{edition}}"
    fields:
      - name: book
        label: 책
        widget: relation
        collection: books
        value_field: id
        search_fields: [id, title]
        display_fields: ["{{id}} {{title}}"]
      - { name: edition, label: 판 이름, hint: "책 정보의 '최신판' 판 이름과 같아야 합니다 (예: 개정판)" }
      - name: toc
        label: 목차
        label_singular: 목차 항목
        widget: list
        summary: "{{fields.page}}쪽 · {{fields.title}}"
        hint: "읽기 화면의 목차와 장 나누기에 쓰입니다. 쪽은 아래 본문의 '=== ○쪽 ===' 순서(몇 번째 쪽인지)입니다."
        fields:
          - { name: title, label: 제목 }
          - { name: page, label: 쪽, widget: number, value_type: int }
          - { name: sub, label: 아랫단계, widget: boolean, default: false }
          - { name: at, label: 쪽 중간에서 시작, required: false, hint: "한 쪽 안에서 새 장이 시작될 때, 그 장 첫 문단의 앞부분 글을 적습니다 (예: 붓다 사사낭). 보통은 비워 둡니다." }
      - name: images
        label: 그림 올리기
        label_singular: 그림
        widget: list
        required: false
        hint: "본문에 넣을 그림을 여기에 올리고, 본문의 원하는 자리에 빈 줄을 두고 ![그림 설명](/uploads/파일이름.jpg) 처럼 적습니다(설명을 화면에 보이지 않게 하려면 ![#그림 설명](…) 처럼 # 을 붙임). 표는 | 칸 | 칸 | 처럼 줄마다 세로줄로 나눠 적습니다."
        fields:
          - { name: image, label: 그림, widget: image }
          - { name: caption, label: 설명, required: false }
      - name: body
        label: 본문
        widget: text
        hint: "'=== 12쪽 ===' 줄은 쪽의 시작입니다. 이 줄은 지우거나 바꾸지 마세요. 문단과 문단 사이는 빈 줄 하나로 나눕니다. 굵게 하려면 글을 골라서 나타나는 'B 굵게' 단추를 누르세요(Ctrl+B 도 됨). 그러면 **글** 처럼 별표 두 개로 감싸집니다. 다시 누르면 풀립니다."

  # ───────── 소식 ─────────
  - name: news
    editor: { preview: false }
    label: 소식
    label_singular: 소식
    description: 블로그·카페 글을 그대로 붙여넣어도 됩니다.
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slugword}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 제목 }
      - { name: slugword, label: 주소용 짧은 영문, hint: "예: new-book (영문·숫자·-만)", pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만 써 주세요'] }
      - { name: date, label: 날짜, widget: datetime, type: date, format: "YYYY-MM-DD" }
      - { name: category, label: 구분, widget: select, options: [{ label: "도서관 소식", value: library }, { label: "我無말들 소식", value: press }], default: library }
      - { name: pinned, label: 주요 공지 (我無말들 공지사항 맨 위에 고정), widget: boolean, required: false, default: false }
      - { name: updated, label: 고친 날짜, widget: datetime, type: date, format: "YYYY-MM-DD", required: false, hint: "글을 새로 고쳤을 때 넣으면 목록과 글 위에 '고침 날짜'로 보입니다" }
      - { name: source, label: 원문 주소 (블로그·카페), required: false }
      - name: book
        label: 관련 책
        widget: relation
        collection: books
        value_field: id
        search_fields: [id, title]
        display_fields: ["{{id}} {{title}}"]
        required: false
      - { name: body, label: 본문, widget: markdown }

  # ───────── 글 페이지 ─────────
  - name: pages
    editor: { preview: false }
    label: 글 페이지
    files:
      - name: about
        label: 소개
        file: content/pages/about.md
        fields:
          - { name: title, label: 제목 }
          - { name: homage, label: 귀경게, required: false }
          - { name: body, label: 본문, widget: markdown }
      - name: press-about
        label: 출판사 소개
        file: content/pages/press-about.md
        fields:
          - { name: title, label: 제목 }
          - { name: body, label: 본문, widget: markdown }
      - name: press-support
        label: 후원계좌
        file: content/pages/press-support.md
        fields:
          - { name: title, label: 제목 }
          - { name: bank, label: 은행 }
          - { name: account, label: 계좌번호 }
          - { name: holder, label: 예금주 }
          - { name: body, label: 안내 글 (두 줄), widget: text }

  # ───────── 목록 ─────────
  - name: lists
    editor: { preview: false }
    label: 목록 (스승·주제·제공처 등)
    files:
      - name: settings
        label: 사이트 기본 정보
        file: content/settings.json
        fields:
          - { name: site_name, label: 사이트 이름 }
          - { name: site_sub, label: 영문 부제 }
          - { name: kakao_js_key, label: 카카오 JavaScript 키, required: false, hint: "카카오 개발자 사이트(developers.kakao.com)의 앱 JavaScript 키. 고른 글을 컴퓨터에서도 카카오톡으로 바로 공유할 때 씁니다. 공개용 키라 사이트에 그대로 들어갑니다." }
          - { name: paper_request_url, label: 종이책 보시 신청서 주소, required: false, hint: "'종이책 보시 신청' 단추를 누르면 열릴 신청서 주소. 비워 두면 단추를 누를 수 없고 표시만 됩니다." }
          - { name: site_url, label: 사이트 주소 }
          - { name: files_base, label: 파일 저장소 주소, hint: "보통 바꾸지 않습니다" }
          - { name: verse_pali, label: 첫 화면 빨리어 게송 }
          - { name: verse_ko, label: 첫 화면 게송 우리말 }
          - { name: verse_cite, label: 게송 출처 }
          - name: publisher
            label: 출판사 정보
            widget: object
            fields:
              - { name: name, label: 출판사 }
              - { name: publisher_person, label: 발행인 }
              - { name: phone, label: 전화 }
              - { name: email, label: 이메일 }
              - { name: registration, label: 출판등록 }
              - { name: license, label: 기본 라이선스 }
          - { name: footer_license, label: 맨 아래 라이선스 안내, widget: text }
          - { name: footer_sadhu, label: 맨 아래 회향 글 }
      - name: teachers
        label: 스승
        file: content/teachers.json
        fields:
          - name: items
            label: 스승
            label_singular: 스승
            widget: list
            summary: "{{fields.name}} ({{fields.tradition}})"
            fields:
              - { name: id, label: 영문 아이디, hint: "주소에 쓰입니다. 영문 소문자·- 만. 한 번 정하면 바꾸지 마세요.", pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만'] }
              - { name: name, label: 대표 이름, hint: "사이트에 나오는 이름 (예: 우 조띠까 사야도)" }
              - { name: roman, label: 로마자, required: false }
              - { name: aliases, label: 다른 표기들, widget: list, required: false, hint: "책마다 다르게 적힌 이름. 검색에 쓰입니다." }
              - name: tradition
                label: 수행전통
                widget: relation
                collection: lists
                file: traditions
                value_field: "items.*.id"
                search_fields: ["items.*.name"]
                display_fields: ["items.*.name"]
              - { name: bio, label: 소개, widget: markdown, required: false }
              - { name: photo, label: 사진, widget: image, required: false }
      - name: traditions
        label: 수행전통
        file: content/traditions.json
        fields:
          - name: items
            label: 수행전통
            label_singular: 전통
            widget: list
            summary: "{{fields.region}} · {{fields.name}}"
            fields:
              - { name: id, label: 영문 아이디, pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만'] }
              - { name: region, label: 지역 묶음, hint: "미얀마, 태국, 한국, 학자·서구 등" }
              - { name: name, label: 이름 }
              - name: representatives
                label: 대표 스승
                widget: relation
                collection: lists
                file: teachers
                value_field: "items.*.id"
                search_fields: ["items.*.name"]
                display_fields: ["items.*.name"]
                multiple: true
                required: false
      - name: topics
        label: 주제
        file: content/topics.json
        fields:
          - name: main
            label: 주요 자료
            widget: list
            summary: "{{fields.label}}"
            fields: [{ name: label, label: 이름 }]
          - name: items
            label: 주제
            label_singular: 주제
            hint: 위아래로 끌어 순서를 바꿀 수 있습니다. 같은 묶음은 붙여 두세요. 이름을 바꾸면 책들의 주제도 함께 고쳐야 합니다.
            widget: list
            summary: "{{fields.group}} › {{fields.label}}"
            fields:
              - { name: label, label: 주제 이름 }
              - { name: group, label: 묶음, hint: "교리, 믿음·공덕, 계율, 수행, 경전·교학, 언어 …" }
      - name: providers
        label: 자료 제공처·협력 단체
        file: content/providers.json
        fields:
          - name: items
            label: 제공처
            label_singular: 제공처
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: 영문 아이디, pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만'] }
              - { name: name, label: 이름 }
              - { name: kind, label: 종류, widget: select, options: [출판사, 단체, 승원·사원, 개인, 기타] }
              - { name: urls, label: 사이트 주소들, widget: list, required: false }
              - { name: partner, label: 협력 단체로 보이기, widget: boolean, default: false }
              - { name: note, label: 짧은 설명, required: false }
              - { name: image, label: 대표 이미지 주소 (선택), required: false, hint: "추천·협력 사이트 카드에 보일 그림 주소. 비워 두면 네이버 카페는 카페 대표 이미지를 자동으로 가져옵니다." }
      - name: permissions
        label: 게시 허락 기록
        file: content/permissions.json
        fields:
          - name: items
            label: 허락
            label_singular: 허락
            widget: list
            summary: "{{fields.name}} · {{fields.scope}}"
            fields:
              - { name: id, label: 영문 아이디, pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만'] }
              - { name: kind, label: 개인/단체, widget: select, options: [개인, 단체] }
              - { name: name, label: 허락한 분·단체 }
              - { name: scope, label: 허락 범위, hint: "예: 이 단체의 모든 자료 / 『자애수행』 한 권" }
              - { name: conditions, label: 조건, required: false }
              - { name: date, label: 허락 날짜, required: false }
              - { name: method, label: 받은 방법, required: false, hint: "이메일, 서면, 구두 …" }
              - { name: image, label: 허락서 그림, widget: image, required: false }
              - { name: image_public, label: 허락서를 누구나 보게 하기, widget: boolean, default: false }
              - { name: status, label: 상태, widget: select, options: [유효, 만료, 철회], default: 유효 }
              - { name: note, label: 메모 (사이트에 안 나옴), widget: text, required: false }
      - name: links
        label: 추천 사이트
        file: content/links.json
        fields:
          - name: groups
            label: 묶음
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 묶음 이름 }
              - { name: desc, label: 설명, required: false }
              - name: items
                label: 사이트
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: 이름 }
                  - { name: url, label: 주소 }
                  - { name: note, label: 설명, required: false }
                  - { name: lang, label: 언어 줄 (선택), required: false, hint: "예: 영어, 미얀마어. 적으면 묶음 안에서 같은 언어끼리 한 줄로 모아 보입니다." }
      - name: playlists
        label: 법문 재생목록
        file: content/playlists.json
        fields:
          - name: items
            label: 재생목록
            widget: list
            summary: "{{fields.group}} › {{fields.name}}"
            fields:
              - { name: id, label: 영문 아이디, pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·- 만'] }
              - { name: group, label: 묶음, hint: "선원별, 스승별 …" }
              - { name: name, label: 이름 }
              - name: teacher
                label: 스승 (있으면 책 페이지와 이어짐)
                widget: relation
                collection: lists
                file: teachers
                value_field: "items.*.id"
                search_fields: ["items.*.name"]
                display_fields: ["items.*.name"]
                required: false
              - { name: source, label: 출처 표시, hint: "예: 팟빵 · 한국마하시선원" }
              - { name: download, label: mp3 다운받기 주소, required: false, hint: "넣으면 채널 단추 왼쪽에 'mp3 다운받기' 단추가 생깁니다 (예: 구글 드라이브 폴더 주소)" }
              - { name: podbbang, label: 팟빵 채널 번호, required: false, hint: "팟빵 채널 주소 podbbang.com/channels/1793926 의 숫자. 넣어 두면 사이트를 새로 만들 때마다 새 법문이 자동으로 들어옵니다" }
              - { name: rss, label: 팟캐스트 RSS 주소 (팟빵 말고 다른 곳), required: false }
              - name: episodes
                label: 직접 넣는 법문 (RSS가 없을 때)
                widget: list
                required: false
                fields:
                  - { name: title, label: 제목 }
                  - { name: audio, label: 음성 파일 주소 }
                  - { name: date, label: 날짜, required: false }
                  - { name: duration, label: 길이, required: false }
      - name: variants
        label: 표기 사전 (검색용)
        file: content/variants.json
        fields:
          - name: items
            label: 같은 말 묶음
            hint: 한 묶음에 같은 뜻의 여러 표기를 적으면, 어느 것으로 찾아도 함께 찾아집니다.
            widget: list
            summary: "{{fields.words}}"
            fields:
              - { name: words, label: 표기들, widget: list }
