# 그림책 번역 작업용 자동 작업 (이 가지에서만 돈다. 사이트 배포와 무관)
name: storybooks-pipeline
on:
  push:
    branches: [storybooks-src]
    paths: ["jobs/**", "ko/**"]
permissions:
  contents: write
concurrency: { group: storybooks, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: 원본 그림 보관함
        uses: actions/cache@v4
        with:
          path: cache/orig
          key: storybooks-orig-${{ github.run_id }}
          restore-keys: storybooks-orig-
      - name: 도구 설치
        run: |
          timeout 300 sudo apt-get update -q -o Acquire::Retries=2 || echo '목록 받기 실패'
          timeout 400 sudo apt-get install -y -q -o Acquire::Retries=2 --fix-missing tesseract-ocr > /dev/null || echo '도구 받기 실패 — 계속'
          which tesseract || echo '글자 읽기 도구 없음 — 그림 만들기는 계속 (남은 영어 자동 검사만 빠짐)'
          pip install -q opencv-python-headless pillow numpy fonttools boto3 img2pdf
      - name: 작업 실행
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OMP_THREAD_LIMIT: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "storybooks-bot"
          git config user.email "actions@users.noreply.github.com"
          bash jobs/run.sh 2>&1 | tee jobs/last-log.txt
      - name: 결과 저장
        if: always()
        run: |
          git add -A
          git commit -q -m "작업 결과 [skip ci]" || echo "바뀐 것 없음"
          git pull -q --rebase -X theirs || true
          git push
